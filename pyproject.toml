[project]
name = "mmsegmentation"
version = "0.13.0"
description = "Open MMLab Semantic Segmentation Toolbox and Benchmark"
authors = [
    {name = "MMSegmentation Authors", email = "openmmlab@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = {text = "Apache License 2.0"}
keywords = ["computer vision", "semantic segmentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
]

dependencies = [
    "setuptools==69.5.1",
    "wheel",
    "torch",  # PyTorch 1.7.1+cu110
    "torchvision",  # torchvision 0.8.2+cu110
    "timm==0.3.2",
    "mmcv-full",  # mmcv-full 1.2.7 (torch1.7.0+cu110)
    "opencv-python==4.5.1.48",  # READMEの正確なバージョン
    "matplotlib",
    "numpy<2",
    "terminaltables",
    "pillow",
    "tqdm",
    "imageio",
    "scikit-image",
    "omegaconf",
    "ipython",
    "attrs",
    "debugpy",
    "pylint",
]

[project.urls]
Homepage = "http://github.com/open-mmlab/mmsegmentation"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {exclude = ["configs", "tools", "demo"]}}

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu110/torch-1.7.1%2Bcu110-cp38-cp38-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu110/torchvision-0.8.2%2Bcu110-cp38-cp38-linux_x86_64.whl" }
mmcv-full = { url = "https://download.openmmlab.com/mmcv/dist/cu110/torch1.7.0/mmcv_full-1.2.7-cp38-cp38-manylinux1_x86_64.whl" }
